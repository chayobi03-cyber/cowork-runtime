# TOPIC_REGISTRY.yaml
# v1 스키마 — Topic Card 접수 후 이 레지스트리에 요약 등록한다.
# 필드는 TOPIC_CARD_TEMPLATE.md의 Level A 필드와 1:1 대응한다.
#
# status 값: candidate(접수) / under_review(검토중) / needs_changes / approved / rejected / hold
#   ※ status=candidate 는 "구현됨"을 의미하지 않는다 (AI_CONTEXT.md 금지추론 목록 참조)

schema_version: v1

topics:
  - topic_id: TOPIC-0001
    topic_name: "주간 시험 데이터 정리 및 그래프화 (P2-01 음성 시범 결과 — 가상 데이터)"
    subpart: ""                      # 관련 소파트 (미정 시 공란 유지)
    problem: "매주 반복되는 수작업, 단위 오입력으로 인한 재작업 발생"
    representative_input: "시험 원시 데이터(엑셀)"
    representative_output: "단위 변환된 데이터 + 그래프"
    candidate_mvp: false             # true라도 "구현 완료"가 아니라 "MVP 후보 검토 대상"임
    company_only_validation: null    # Y/N — 체크리스트 통과 전에는 null 유지
    external_ai_safety: null         # Y/N — 체크리스트 통과 전에는 null 유지
    status: candidate                # 가상 시범 데이터 — 실제 파트원 확인 전에는 승격 금지
    next_action: "실제 파트원에게 이 카드 초안이 맞는지 확인 필요 (INTAKE_QUEUE/SAMPLE_VOICE_TO_CARD.md 참조)"
    last_updated: "2026-07-12"

# 신규 등록 시 이 샘플 행을 복제하지 말고, 실제 Topic Card 내용을 기반으로 새 항목을 추가한다.
# company_only_validation / external_ai_safety는 EXPORT_SAFETY_CHECKLIST.md 통과 후에만 값을 채운다.
# ※ TOPIC-0001은 P2-01(음성→Card) 파이프라인 검증용 가상 데이터다. 실제 등록이 아니다.

  - topic_id: TOPIC-0002
