# TOPIC_REGISTRY.yaml
# v1 스키마 — Topic Card 접수 후 이 레지스트리에 요약 등록한다.
# 필드는 TOPIC_CARD_TEMPLATE.md의 Level A 필드와 1:1 대응한다.
#
# status 값: candidate(접수) / under_review(검토중) / needs_changes / approved / rejected / hold
#   ※ status=candidate 는 "구현됨"을 의미하지 않는다 (AI_CONTEXT.md 금지추론 목록 참조)
#
# schema_version: v2에서 parent_topic_id 필드 추가 (2026-07-13, 부서 회의 후속)
#   - null: 독립 Topic이거나, 다른 Topic들의 "공통부분" 역할을 하는 부모 Topic
#   - TOPIC-xxxx: 해당 부모 Topic 아래 딸린 업무별 특화 Topic (소파트 기준이 아니라 업무 기준으로 계속 추가됨)
# schema_version: v2.1에서 judge 필드 추가 (2026-07-13, 냉정 audit MAJOR-1 반영)
#   - 이 Topic을 누가 Approve/Reject/Needs changes 판정하는지. 전 항목에 적용한다
#     (TOPIC-0003에만 단독으로 넣었던 것을 audit에서 지적받아 스키마 공식화 + 소급 적용함)

